name: almurshid
description: Al-Murshid (المرشد الدراسي) - crawls UCAS Moodle and builds a study plan. Local only, no server.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  webview_flutter_android: any
  html: ^0.15.4
  path_provider: ^2.1.0
  wakelock_plus: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/bg_tile.png
    - assets/logo.png
