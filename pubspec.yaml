name: almurshid
description: ALMULZIM (المُلزم) - crawls UCAS Moodle and builds a study plan. Local only, no server.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  webview_flutter_android: any
  html: ^0.15.4
  flutter_secure_storage: ^9.2.2   # AI key in Android Keystore
  path_provider: ^2.1.0
  wakelock_plus: ^1.2.0
  local_auth: ^2.3.0              # app lock (fingerprint / phone PIN)
  video_player: ^2.8.0            # play downloaded videos
  youtube_explode_dart: ^2.3.0    # YouTube downloads with quality choice
  pdfx: ^2.9.2                    # in-app PDF viewer
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
  assets:
    - assets/bg_tile.png
    - assets/logo.png
